# /etc/nginx/sites-available/ship-booking  (replace booking.example.in with the real domain)
server {
    listen 80;
    server_name booking.example.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name booking.example.in;

    # Certificates from Let's Encrypt: sudo certbot --nginx -d booking.example.in
    ssl_certificate     /etc/letsencrypt/live/booking.example.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booking.example.in/privkey.pem;

    client_max_body_size 5m;

    location /static/ {
        alias /srv/ship-booking/app/staticfiles/;
        expires 1y;                      # file names are versioned, so caching forever is safe
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        # Overwrite (never append) so visitors can't fake their IP. Matches TRUSTED_PROXY_HEADER=HTTP_X_REAL_IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
