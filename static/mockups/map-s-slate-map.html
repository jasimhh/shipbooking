<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map S · Slate Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{--bg:#0B0C0E;--side:#0F1013;--panel:#131418;--panel-2:#191A1F;--hover:#1D1F25;--line:#24262D;--line-2:#2E3038;--text:#E8E9ED;--dim:#8A8D98;--faint:#5C5F6A;--accent:#4C8DFF;--green:#3DD68C;--amber:#F2B54B;--red:#F2555A}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:400 13px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .app{display:grid;grid-template-columns:1fr;min-height:100vh}@media(min-width:960px){.app{grid-template-columns:220px 1fr}}
  aside.nav{background:var(--side);border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:2px}
  .ws{display:flex;align-items:center;gap:8px;padding:8px;font-weight:600}.ws i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#4C8DFF,#3DD68C);display:grid;place-items:center;font-style:normal;font-size:11px;color:#0B0C0E;font-weight:800}
  .cmd{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;color:var(--faint);margin:4px 0 10px;background:var(--panel)}.cmd kbd{margin-left:auto;font:500 11px Inter;border:1px solid var(--line-2);border-radius:4px;padding:0 5px;color:var(--dim)}
  .nav a{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:6px;color:var(--dim);text-decoration:none;font-weight:500}.nav a:hover{background:var(--hover);color:var(--text)}.nav a[aria-current]{background:var(--panel-2);color:var(--text)}
  .nav a .n{margin-left:auto;font-size:11px;color:var(--amber)}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:600}.live b{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(61,214,140,.2)}
  main{min-width:0}
  .tb{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}.tb .sp{flex:1}
  .tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}.tabs button{font:500 12px Inter;background:none;border:0;color:var(--dim);padding:5px 10px;border-radius:6px;cursor:pointer}.tabs button[aria-pressed=true]{background:var(--panel-2);color:var(--text)}
  .btn{display:inline-flex;align-items:center;gap:6px;font:600 13px Inter;border:1px solid transparent;background:var(--text);color:var(--bg);padding:6px 10px;border-radius:6px;cursor:pointer}.btn.sec{background:var(--panel-2);color:var(--text);border-color:var(--line-2)}
  .content{display:grid;grid-template-columns:1fr}@media(min-width:1200px){.content{grid-template-columns:1fr 360px}}
  .main{padding:16px 20px 40px;min-width:0}
  .hero{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0C1622}
  .hero svg{display:block;width:100%;height:auto}
  .hud{position:absolute;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap}
  .hud span{background:rgba(19,20,24,.85);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;backdrop-filter:blur(6px)}.hud b{display:block;font-size:15px}
  .hud small{color:var(--dim)}
  .stamp{position:absolute;right:12px;bottom:12px;color:var(--amber);font-size:11px;background:rgba(19,20,24,.85);padding:4px 8px;border-radius:6px}
  .port{font:600 12px Inter;fill:#E8E9ED}.place{font:500 10px Inter;fill:#3D5A75;letter-spacing:.14em;text-transform:uppercase}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0;background:var(--panel)}
  .stat{padding:12px 14px;border-right:1px solid var(--line)}.stat:last-child{border-right:0}.stat span{color:var(--dim)}.stat b{display:block;font-size:20px;font-weight:600}
  .up{color:var(--green);font-size:12px}.dn{color:var(--red);font-size:12px}
  table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
  th{font-weight:500;color:var(--faint);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px}td{padding:9px 12px;border-bottom:1px solid var(--line)}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--hover)}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--dim)}
  .dot{display:inline-flex;align-items:center;gap:6px}.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.g{color:var(--green)}.a{color:var(--amber)}.rd{color:var(--red)}.bl{color:var(--accent)}
  .av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#0B0C0E;margin-right:8px;vertical-align:middle}
  tr[data-i]{cursor:pointer}tr[aria-selected=true]{background:#1A2233!important}
  h2{font-size:13px;font-weight:600;margin:18px 0 8px}
  .sheet{border-left:1px solid var(--line);background:var(--side);padding:18px;min-width:0}
  .sheet .top{display:flex;align-items:center;gap:12px}.sheet .av{width:40px;height:40px;font-size:14px;margin:0}.sheet h3{font-size:16px;margin:0}.sheet .sub{color:var(--dim)}
  .kv{display:grid;grid-template-columns:90px 1fr;gap:8px 12px;margin:16px 0}.kv dt{color:var(--faint)}.kv dd{margin:0}
  .tl{list-style:none;padding:0;margin:8px 0 0 6px;border-left:1px solid var(--line-2)}.tl li{position:relative;padding:0 0 12px 16px}.tl li::before{content:"";position:absolute;left:-4px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--line-2);box-shadow:0 0 0 3px var(--side)}.tl li.on::before{background:var(--accent)}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .15s;z-index:5;padding:16px}.modal-wrap.open{opacity:1;pointer-events:auto}
  .modal{width:min(520px,100%);background:var(--panel);border:1px solid var(--line-2);border-radius:12px}.mh{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600}.mb{padding:4px 16px 16px}.mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  label{display:block;font-weight:500;color:var(--dim);margin:12px 0 5px}
  .modal input,.modal select,.modal textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;color-scheme:dark}.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--accent)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(prefers-reduced-motion:reduce){.modal-wrap{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="map" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></symbol>
  <symbol id="cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  <symbol id="ship" viewBox="0 0 24 24"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1s1.2 1 2.5 1c2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.4 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.9.9 5.3 2.8 7.8"/><path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"/></symbol>
  <symbol id="tix" viewBox="0 0 24 24"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/></symbol>
  <symbol id="users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></symbol>
  <symbol id="ref" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="msg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</defs></svg>
<div class="app">
  <aside class="nav" aria-label="Admin">
    <div class="ws"><i>SB</i>Ship Booking</div>
    <div class="cmd"><svg class="i"><use href="#search"/></svg>Search or jump to…<kbd>Ctrl K</kbd></div>
    <a href="#" aria-current="page"><svg class="i"><use href="#map"/></svg>Live map</a>
    <a href="#"><svg class="i"><use href="#cal"/></svg>Sailings<span class="n">2 delayed</span></a>
    <a href="#"><svg class="i"><use href="#ship"/></svg>Ferries</a>
    <a href="#"><svg class="i"><use href="#tix"/></svg>Bookings</a>
    <a href="#"><svg class="i"><use href="#users"/></svg>Passengers</a>
    <a href="#"><svg class="i"><use href="#ref"/></svg>Refunds<span class="n">3</span></a>
    <a href="#"><svg class="i"><use href="#msg"/></svg>Support<span class="n">7</span></a>
  </aside>
  <main>
    <div class="tb"><span class="live"><b aria-hidden="true"></b>Live</span><span style="color:var(--dim)">Operations / <b style="color:var(--text)">Live map</b></span><span class="sp"></span>
      <div class="tabs" role="group" aria-label="Route"><button data-route="mum" aria-pressed="false">Mumbai ⇄ Mandwa</button><button data-route="and" aria-pressed="true">Andamans</button></div>
      <button class="btn" id="add"><svg class="i"><use href="#plus"/></svg>New ferry</button></div>
    <div class="content">
      <div class="main">
        <div class="hero" id="hero" aria-label="Live route map"></div>
        <div class="stats">
          <div class="stat"><span>Ferries out</span><b>2 of 3</b><span class="up">1 in repairs</span></div>
          <div class="stat"><span>On board now</span><b>24</b><span class="up">1 sailing at sea</span></div>
          <div class="stat"><span>Next departure</span><b id="nextDep">06:30</b><span class="up" id="nextIn">in 8 min</span></div>
          <div class="stat"><span>Delays</span><b>2</b><span class="dn">+20 min worst</span></div>
        </div>
        <h2 id="pt">Passengers</h2>
        <table><thead><tr><th>Passenger</th><th>Booking</th><th>Age</th><th>Ticket</th></tr></thead><tbody id="pax"></tbody></table>
      </div>
      <aside class="sheet" id="detail" aria-live="polite" aria-label="Passenger details"></aside>
    </div>
  </main>
</div>
<div class="modal-wrap" id="drawer"><form class="modal" aria-label="New ferry" onsubmit="return false">
  <div class="mh">New ferry</div>
  <div class="mb"><label for="f1">Name</label><input id="f1" placeholder="MV …">
    <div class="row2"><div><label for="f2">Operator</label><select id="f2"><option>Demo Ferries</option><option>Example Lines</option></select></div><div><label for="f3">IMO number</label><input id="f3"></div></div>
    <div class="row2"><div><label for="f4">Seating</label><select id="f4"><option>By capacity</option><option>Numbered seats</option></select></div><div><label for="f5">Home route</label><select id="f5"><option>Mumbai ⇄ Mandwa</option><option>Andamans</option></select></div></div>
    <label for="f6">Classes and capacity</label><textarea id="f6" rows="3">Deck · 120
Seater · 60</textarea></div>
  <div class="mf"><button class="btn sec" type="button" id="close">Cancel</button><button class="btn">Create ferry</button></div>
</form></div>
<script>
const D={
 mum:{land:`<path d="M150 0 L330 0 L350 120 L330 240 L300 330 L270 410 L240 460 L215 470 L200 420 L180 330 L160 200Z"/><path d="M620 0 L1000 0 L1000 600 L760 600 L720 540 L700 460 L670 410 L650 340 L670 260 L640 180 L620 100Z"/>`,places:`<text class="place" x="190" y="80">Mumbai</text><text class="place" x="800" y="120">Raigad</text>`,path:"M262 370 C380 380 520 440 678 440",ports:[[262,370,"Ferry Wharf",-110,-4],[678,440,"Mandwa Jetty",14,4]],moving:true,hud:[["MV Demo Wave","At sea · ETA 06:45"],["24/24","on board"]],next:["07:00","+20 min late"],
  pax:[["Meera Iyer","MI","#3DD68C","SB7QW2MZ4D","61 · Female","meera@example.com","+91 98111 11111","Cabin seat 07","g","Boarded","Booked 28 Oct|Paid|Ticket issued|Boarded 05:38|At sea"]]},
 and:{land:`<path d="M140 140 L260 110 L320 170 L340 280 L300 390 L250 500 L180 540 L130 450 L110 320Z"/><path d="M640 80 L740 60 L800 120 L790 210 L720 260 L650 210 L620 140Z"/><path d="M590 330 L650 320 L670 360 L630 390 L585 375Z"/>`,places:`<text class="place" x="150" y="230">South Andaman</text><text class="place" x="650" y="45">Swaraj Dweep</text>`,path:"M320 350 C450 330 580 230 650 175",ports:[[320,350,"Phoenix Bay Jetty",16,30],[650,175,"Havelock Jetty",16,5]],moving:false,hud:[["MV Demo Star","Boarding · Gate 2"],["2/180","checked in"]],next:["06:30","in 8 min"],
  pax:[["Asha Rao","AR","#4C8DFF","SBKH46K99Z","34 · Female","asha@example.com","+91 98000 00000","Deck","g","Valid","Booked 30 Oct 21:12|Paid 21:17|Ticket issued 21:17|Waiting to board"],["Kiran Rao","KR","#4C8DFF","SBKH46K99Z","8 · Male","asha@example.com","+91 98000 00000","Deck","g","Valid","Booked 30 Oct 21:12|Paid 21:17|Ticket issued 21:17|Waiting to board"]]}};
let route="and";
function hero(d){document.getElementById("hero").innerHTML=`<svg viewBox="0 0 1000 420" preserveAspectRatio="xMidYMid slice"><rect width="1000" height="600" fill="#0C1622"/><g fill="none" stroke="#12263A">${[...Array(8)].map((_,k)=>`<path d="M-50 ${40+k*60} Q250 ${10+k*60} 500 ${50+k*60} T1050 ${30+k*60}"/>`).join("")}</g><g fill="#16293C" stroke="#21405E">${d.land}</g>${d.places}<path id="rt" d="${d.path}" fill="none" stroke="#4C8DFF" stroke-width="2" stroke-dasharray="7 6"/>${d.ports.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="#0C1622" stroke="#E8E9ED" stroke-width="2"/><text class="port" x="${p[0]+p[3]}" y="${p[1]+p[4]}">${p[2]}</text>`).join("")}${d.moving?`<circle r="8" fill="#4C8DFF" style="filter:drop-shadow(0 0 6px #4C8DFF)"><animateMotion dur="20s" repeatCount="indefinite"><mpath href="#rt"/></animateMotion></circle>`:`<circle cx="${d.ports[0][0]}" cy="${d.ports[0][1]}" r="8" fill="#3DD68C" style="filter:drop-shadow(0 0 6px #3DD68C)"/>`}</svg><div class="hud">${d.hud.map(h=>`<span><b>${h[0]}</b><small>${h[1]}</small></span>`).join("")}</div><div class="stamp">Example data · estimated position</div>`;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)document.querySelectorAll("animateMotion").forEach(a=>a.remove())}
function det(p){const ev=p[10].split("|");document.getElementById("detail").innerHTML=`<div class="top"><span class="av" style="background:${p[2]}">${p[1]}</span><div><h3>${p[0]}</h3><div class="sub">${p[4]}</div></div></div><dl class="kv"><dt>Booking</dt><dd class="mono">${p[3]}</dd><dt>Email</dt><dd>${p[5]}</dd><dt>Mobile</dt><dd>${p[6]}</dd><dt>Class</dt><dd>${p[7]}</dd></dl><h2 style="margin-top:0">Activity</h2><ol class="tl">${ev.map((e,j)=>`<li class="${j===ev.length-1?"on":""}">${e}</li>`).join("")}</ol><div class="acts"><button class="btn">Open booking</button><button class="btn sec">Reissue</button></div>`}
function render(){const d=D[route];hero(d);document.getElementById("nextDep").textContent=d.next[0];document.getElementById("nextIn").textContent=d.next[1];
  document.getElementById("pt").textContent=`Passengers · ${route==="and"?"06:30 Phoenix Bay → Havelock":"05:45 Mandwa → Mumbai"}`;
  const tb=document.getElementById("pax");tb.innerHTML=d.pax.map((p,i)=>`<tr data-i="${i}" tabindex="0" aria-selected="${i===0}"><td><span class="av" style="background:${p[2]}">${p[1]}</span>${p[0]}</td><td class="mono">${p[3]}</td><td>${p[4].split(" ")[0]}</td><td><span class="dot ${p[8]}">${p[9]}</span></td></tr>`).join("");
  tb.querySelectorAll("tr").forEach(tr=>{tr.onclick=()=>{det(d.pax[tr.dataset.i]);tb.querySelectorAll("tr").forEach(x=>x.setAttribute("aria-selected",x===tr))};tr.onkeydown=e=>{if(e.key==="Enter")tr.onclick()}});det(d.pax[0]);
  document.querySelectorAll("[data-route]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.route===route))}
document.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>{route=b.dataset.route;render()});render();
const dr=document.getElementById("drawer");const close=()=>dr.classList.remove("open");document.getElementById("add").onclick=()=>{dr.classList.add("open");dr.querySelector("input").focus()};document.getElementById("close").onclick=close;dr.onclick=e=>{if(e.target===dr)close()};document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
</script>
</body>
</html>
