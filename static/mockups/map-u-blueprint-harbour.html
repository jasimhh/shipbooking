<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map U · Blueprint Harbour Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap">
<style>
  :root{--blue:#123E6B;--blue-2:#164A7E;--blue-3:#1B5791;--deep:#0E3358;--line:rgba(255,255,255,.3);--faint:rgba(255,255,255,.1);--white:#F2F7FC;--dim:#A9C3DD;--yellow:#FFD84A;--green:#9BF0C4;--red:#FF8A7A;--cyan:#7FD3FF}
  *{box-sizing:border-box}body{margin:0;color:var(--white);font:400 14px/1.55 "Roboto Mono",ui-monospace,monospace;background:var(--deep)}
  :focus-visible{outline:2px dashed var(--yellow);outline-offset:3px}
  .grid-bg{background:var(--blue);background-image:linear-gradient(var(--faint) 1px,transparent 1px),linear-gradient(90deg,var(--faint) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px}
  .shell{display:grid;grid-template-columns:1fr;min-height:100vh}@media(min-width:1000px){.shell{grid-template-columns:1fr 430px}}
  .mapwrap{position:relative;min-height:58vh}
  .mapwrap svg{position:absolute;inset:0;width:100%;height:100%}
  .titleblock{position:absolute;right:14px;bottom:14px;border:1px solid var(--white);background:rgba(18,62,107,.9);font-size:11px;display:grid;grid-template-columns:auto auto}
  .titleblock div{padding:6px 10px;border-right:1px solid var(--line)}.titleblock div:last-child{border-right:0}.titleblock b{display:block;font:600 13px "Chakra Petch";text-transform:uppercase;letter-spacing:.06em}
  @media(max-width:700px){.titleblock{display:none}}
  .float{position:absolute;left:14px;right:14px;top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .chip{border:1px solid var(--white);background:rgba(18,62,107,.92);padding:7px 12px;font:600 13px "Chakra Petch";text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
  .chip i{width:8px;height:8px;background:var(--green);box-shadow:0 0 0 3px rgba(155,240,196,.25)}
  .routes{display:flex;border:1px solid var(--white);background:rgba(18,62,107,.92)}
  .routes button{font:600 13px "Chakra Petch";text-transform:uppercase;letter-spacing:.08em;border:0;background:none;color:var(--dim);padding:7px 12px;cursor:pointer}.routes button+button{border-left:1px solid var(--line)}.routes button[aria-pressed=true]{background:var(--yellow);color:var(--blue)}
  .sp{flex:1}
  .btn{font:600 13px "Chakra Petch";text-transform:uppercase;letter-spacing:.1em;background:var(--yellow);color:var(--blue);border:1px solid var(--yellow);padding:8px 14px;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--white);border-color:var(--white)}
  .ferrycard{position:absolute;left:14px;bottom:14px;border:1px solid var(--white);background:rgba(18,62,107,.94);display:grid;grid-template-columns:auto 1fr auto;max-width:calc(100% - 28px)}
  .ferrycard>*{padding:10px 12px}.ferrycard>*+*{border-left:1px dashed var(--line)}
  .ferrycard .id{font:700 18px "Chakra Petch";color:var(--yellow);display:grid;place-items:center}
  .ferrycard b{display:block;font:600 15px "Chakra Petch";text-transform:uppercase;letter-spacing:.04em}.ferrycard small{color:var(--dim)}
  .ferrycard .eta b{font-size:22px;color:var(--yellow)}
  .lbl{font:500 11px "Roboto Mono";fill:var(--dim);letter-spacing:.04em}.port{font:600 13px "Chakra Petch";fill:var(--white);letter-spacing:.06em;text-transform:uppercase}.place{font:600 12px "Chakra Petch";fill:#7FA7CC;letter-spacing:.2em;text-transform:uppercase}
  .sheet{position:relative;margin-top:-22px;border-top:1px solid var(--white);background:var(--blue-2);padding:12px 16px 30px}
  @media(min-width:1000px){.sheet{margin-top:0;border-top:0;border-left:1px solid var(--white);max-height:100vh;overflow:auto}}
  .handle{width:46px;height:4px;background:var(--line);margin:0 auto 12px}@media(min-width:1000px){.handle{display:none}}
  .head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--white);padding-bottom:8px}
  .head h1{font:700 20px "Chakra Petch";text-transform:uppercase;letter-spacing:.08em;margin:0}.head small{color:var(--dim)}
  .note{font-size:11px;color:var(--yellow);margin:8px 0 12px}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--white);margin-bottom:14px}
  .tabs button{font:600 13px "Chakra Petch";text-transform:uppercase;letter-spacing:.08em;border:0;background:none;color:var(--dim);padding:8px;cursor:pointer}.tabs button+button{border-left:1px solid var(--line)}.tabs button[aria-selected=true]{background:var(--white);color:var(--blue)}
  .tabs button[aria-selected=true]::before{content:"[x] "}.tabs button::before{content:"[ ] "}
  .list{display:grid;gap:8px}
  .item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px dashed var(--line);cursor:pointer;width:100%;font:inherit;color:inherit;text-align:left;background:none}
  .item:hover{background:var(--blue-3)}.item[aria-pressed=true]{border-style:solid;border-color:var(--yellow);background:var(--blue-3)}
  .tagid{font:700 14px "Chakra Petch";width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--white)}
  .item b{display:block;font-weight:500}.item small{display:block;color:var(--dim);font-size:12px}
  .time{font:700 18px "Chakra Petch";color:var(--yellow);width:56px}
  .st{font:600 12px "Chakra Petch";text-transform:uppercase;letter-spacing:.08em}.ok{color:var(--green)}.warn{color:var(--yellow)}.bad{color:var(--red)}.sea{color:var(--cyan)}
  .det{margin-top:16px;border:1px solid var(--white)}
  .det .dh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--white)}
  .det .dh span{font-size:11px;color:var(--yellow)}.det h3{font:700 24px "Chakra Petch";text-transform:uppercase;letter-spacing:.04em;margin:0}
  .spec{width:100%;border-collapse:collapse}.spec td{border-bottom:1px solid var(--line);padding:7px 12px}.spec td:first-child{color:var(--dim);width:104px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;border-right:1px solid var(--line)}
  .acts{display:flex;gap:8px;flex-wrap:wrap;padding:12px}
  .modal-wrap{position:fixed;inset:0;background:rgba(9,30,52,.6);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}.modal-wrap.open{opacity:1;pointer-events:auto}
  .modal{width:min(540px,100%);max-height:92vh;overflow:auto;border:1px solid var(--white);border-bottom:0;padding:16px 18px 24px}
  .modal h2{font:700 20px "Chakra Petch";text-transform:uppercase;letter-spacing:.08em;margin:0 0 4px}
  label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:14px 0 5px}
  .modal input,.modal select,.modal textarea{width:100%;font:500 14px "Roboto Mono";color:var(--white);background:var(--blue);border:1px dashed var(--white);padding:9px 10px;color-scheme:dark}
  .modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-style:solid;border-color:var(--yellow)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(prefers-reduced-motion:reduce){.modal-wrap{transition:none}}
</style>
</head>
<body>
<div class="shell">
  <section class="mapwrap grid-bg" aria-label="Live map">
    <div id="map"></div>
    <div class="float">
      <span class="chip"><i aria-hidden="true"></i>Live · <span id="clock">21:42</span> IST</span>
      <div class="routes" role="group" aria-label="Route"><button data-route="mum" aria-pressed="false">Mumbai</button><button data-route="and" aria-pressed="true">Andamans</button></div>
      <span class="sp"></span><button class="btn" id="add">+ Add ferry</button>
    </div>
    <div class="ferrycard" id="fc"></div>
    <div class="titleblock" aria-hidden="true"><div><span>Sheet</span><b id="sheetNo">02 · Andamans</b></div><div><span>Scale</span><b>NTS</b></div></div>
  </section>
  <section class="sheet grid-bg" aria-label="Details">
    <div class="handle" aria-hidden="true"></div>
    <div class="head"><h1>Ship Booking</h1><small>Harbour master · SB-ADM</small></div>
    <p class="note">Example data · ferry positions estimated from timetable</p>
    <div class="tabs" role="tablist"><button role="tab" data-tab="sail" aria-selected="false">Sailings</button><button role="tab" data-tab="pax" aria-selected="true">Passengers</button><button role="tab" data-tab="fleet" aria-selected="false">Ferries</button></div>
    <div class="list" id="list"></div>
    <div class="det" id="detail" aria-live="polite"></div>
  </section>
</div>
<div class="modal-wrap" id="drawer"><form class="modal grid-bg" aria-label="Add a ferry" onsubmit="return false">
  <h2>New vessel spec</h2><div style="color:var(--dim);font-size:12px">Saved to the fleet register. Add sailings afterwards.</div>
  <label for="f1">Vessel name</label><input id="f1" placeholder="MV …">
  <div class="row2"><div><label for="f2">Operator</label><select id="f2"><option>Demo Ferries</option><option>Example Lines</option></select></div><div><label for="f3">IMO no.</label><input id="f3" placeholder="Optional"></div></div>
  <div class="row2"><div><label for="f4">Seating</label><select id="f4"><option>Capacity</option><option>Assigned seats</option></select></div><div><label for="f5">Home route</label><select id="f5"><option>Mumbai ⇄ Mandwa</option><option>Andamans</option></select></div></div>
  <label for="f6">Classes : capacity</label><textarea id="f6" rows="3">Deck : 120
Seater : 60</textarea>
  <div class="acts" style="padding:16px 0 0"><button class="btn">Approve spec</button><button class="btn ghost" type="button" id="close">Cancel</button></div>
</form></div>
<script>
const D={
 mum:{sheet:"01 · Mumbai",land:`<path d="M150 0 L330 0 L350 120 L330 240 L300 330 L270 410 L240 460 L215 470 L200 420 L180 330 L160 200Z"/><path d="M620 0 L1000 0 L1000 600 L760 600 L720 540 L700 460 L670 410 L650 340 L670 260 L640 180 L620 100Z"/>`,
  places:`<text class="place" x="190" y="110">Mumbai</text><text class="place" x="790" y="150">Raigad</text>`,path:"M262 370 C380 380 520 440 678 440",ports:[[262,370,"Ferry Wharf",-128,-8,"18°56′N 72°50′E"],[678,440,"Mandwa Jetty",16,5,"18°48′N 72°53′E"]],dim:"≈ 1 H",moving:true,
  fc:["DW","MV Demo Wave","At sea · 24/24 on board","06:45","Arrives"],
  sail:[["05:45","Mandwa → Mumbai","MV Demo Wave · 24/24","sea","At sea"],["07:00","Mumbai → Mandwa","MV Demo Wave · 21/24","warn","+20 min"]],
  pax:[["Meera Iyer","MI","SB7QW2MZ4D","61 · F","meera@example.com","+91 98111 11111","Cabin seat 07","sea","Boarded"],["Rohan Das","RD","SBP3XH8K2N","27 · M","rohan@example.com","+91 98222 22222","Deck","bad","Unpaid"]]},
 and:{sheet:"02 · Andamans",land:`<path d="M140 140 L260 110 L320 170 L340 280 L300 390 L250 500 L180 540 L130 450 L110 320Z"/><path d="M640 80 L740 60 L800 120 L790 210 L720 260 L650 210 L620 140Z"/><path d="M590 330 L650 320 L670 360 L630 390 L585 375Z"/>`,
  places:`<text class="place" x="140" y="250">South Andaman</text><text class="place" x="640" y="45">Swaraj Dweep</text><text class="place" x="600" y="412">Shaheed Dweep</text>`,path:"M320 350 C450 330 580 230 650 175",ports:[[320,350,"Phoenix Bay Jetty",18,36,"11°40′N 92°44′E"],[650,175,"Havelock Jetty",18,6,"11°58′N 92°59′E"]],dim:"≈ 2 H 30 MIN",moving:false,
  fc:["DS","MV Demo Star","Boarding · Gate 2 · 2/180","06:30","Departs"],
  sail:[["06:30","Phoenix Bay → Havelock","MV Demo Star · 2/180","ok","Boarding"],["09:30","Havelock → Phoenix Bay","MV Demo Star · 41/180","ok","On time"]],
  pax:[["Asha Rao","AR","SBKH46K99Z","34 · F","asha@example.com","+91 98000 00000","Deck","ok","Valid"],["Kiran Rao","KR","SBKH46K99Z","08 · M","asha@example.com","+91 98000 00000","Deck","ok","Valid"]]}};
const FLEET=[["DS","MV Demo Star","Demo Ferries · cap 180","ok","In service"],["DW","MV Demo Wave","Demo Ferries · 24 seats","ok","In service"],["EB","MV Example Breeze","Example Lines · cap 320","warn","Refit"]];
let route="and",tab="pax";
function map(d){const a=d.ports[0],b=d.ports[1];
  document.getElementById("map").innerHTML=`<svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
  <g fill="rgba(18,62,107,.55)" stroke="#F2F7FC" stroke-width="1.5">${d.land}</g>
  <g fill="none" stroke="rgba(242,247,252,.35)" stroke-dasharray="2 6">${d.land.replace(/<path d="/g,'<path transform="translate(8 8)" d="')}</g>
  ${d.places}
  <path id="rt" d="${d.path}" fill="none" stroke="#FFD84A" stroke-width="2.5" stroke-dasharray="10 6"/>
  <g stroke="#A9C3DD" stroke-width="1"><path d="M${a[0]} ${a[1]+50} H${b[0]}"/><path d="M${a[0]} ${a[1]+42} V${a[1]+58}M${b[0]} ${a[1]+42} V${a[1]+58}"/></g>
  <text class="lbl" x="${a[0]+8}" y="${a[1]+70}" fill="#A9C3DD">CROSSING ${d.dim}</text>
  ${d.ports.map(p=>`<g><circle cx="${p[0]}" cy="${p[1]}" r="9" fill="#123E6B" stroke="#F2F7FC" stroke-width="2"/><path d="M${p[0]-16} ${p[1]}H${p[0]+16}M${p[0]} ${p[1]-16}V${p[1]+16}" stroke="#F2F7FC" stroke-width="1"/><text class="port" x="${p[0]+p[3]}" y="${p[1]+p[4]}">${p[2]}</text><text class="lbl" x="${p[0]+p[3]}" y="${p[1]+p[4]+15}">${p[5]}</text></g>`).join("")}
  ${d.moving?`<g><rect x="-11" y="-11" width="22" height="22" fill="#123E6B" stroke="#FFD84A" stroke-width="2"><animateMotion dur="20s" repeatCount="indefinite" rotate="auto"><mpath href="#rt"/></animateMotion></rect><circle r="4" fill="#FFD84A"><animateMotion dur="20s" repeatCount="indefinite"><mpath href="#rt"/></animateMotion></circle></g>`:`<rect x="${a[0]-11}" y="${a[1]-11}" width="22" height="22" fill="#123E6B" stroke="#9BF0C4" stroke-width="2"/><circle cx="${a[0]}" cy="${a[1]}" r="4" fill="#9BF0C4"/>`}
  <g transform="translate(60 120)" stroke="#F2F7FC" fill="none"><circle r="28"/><path d="M0 -36 L5 0 L0 36 L-5 0Z" fill="#F2F7FC"/><text class="lbl" x="-4" y="-40" fill="#F2F7FC" stroke="none">N</text></g>
  </svg>`;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)document.querySelectorAll("animateMotion").forEach(x=>x.remove());
  const f=d.fc;document.getElementById("fc").innerHTML=`<span class="id">${f[0]}</span><span><b>${f[1]}</b><small>${f[2]}</small></span><span class="eta"><small>${f[4]}</small><b>${f[3]}</b></span>`;
  document.getElementById("sheetNo").textContent=d.sheet}
function det(p){const el=document.getElementById("detail");el.style.display=p?"":"none";if(!p)return;
  el.innerHTML=`<div class="dh"><h3>${p[0]}</h3><span>REF ${p[2]}</span></div><table class="spec"><tr><td>Age/sex</td><td>${p[3]}</td></tr><tr><td>Email</td><td>${p[4]}</td></tr><tr><td>Mobile</td><td>${p[5]}</td></tr><tr><td>Class</td><td>${p[6]}</td></tr><tr><td>Ticket</td><td class="st ${p[7]}">${p[8]}</td></tr></table><div class="acts"><button class="btn">Open booking</button><button class="btn ghost">Call</button><button class="btn ghost">Reissue</button></div>`}
function list(){const d=D[route],el=document.getElementById("list");let h="";
  if(tab==="pax")h=d.pax.map((p,i)=>`<button class="item" data-i="${i}" aria-pressed="${i===0}"><span class="tagid">${p[1]}</span><span><b>${p[0]}</b><small>${p[2]} · ${p[3]}</small></span><span class="st ${p[7]}">${p[8]}</span></button>`).join("");
  if(tab==="sail")h=d.sail.map((s,i)=>`<button class="item" aria-pressed="${i===0}"><span class="time">${s[0]}</span><span><b>${s[1]}</b><small>${s[2]}</small></span><span class="st ${s[3]}">${s[4]}</span></button>`).join("");
  if(tab==="fleet")h=FLEET.map(f=>`<button class="item" aria-pressed="false"><span class="tagid">${f[0]}</span><span><b>${f[1]}</b><small>${f[2]}</small></span><span class="st ${f[3]}">${f[4]}</span></button>`).join("");
  el.innerHTML=h;el.querySelectorAll(".item").forEach(b=>b.onclick=()=>{el.querySelectorAll(".item").forEach(x=>x.setAttribute("aria-pressed",x===b));if(tab==="pax")det(d.pax[b.dataset.i])});
  det(tab==="pax"?d.pax[0]:null)}
function render(){map(D[route]);list();document.querySelectorAll("[data-route]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.route===route));document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab))}
document.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>{route=b.dataset.route;render()});document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
const dr=document.getElementById("drawer");const close=()=>dr.classList.remove("open");document.getElementById("add").onclick=()=>{dr.classList.add("open");dr.querySelector("input").focus()};document.getElementById("close").onclick=close;dr.onclick=e=>{if(e.target===dr)close()};document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
setInterval(()=>{document.getElementById("clock").textContent=new Date().toLocaleTimeString("en-GB",{timeZone:"Asia/Kolkata",hour:"2-digit",minute:"2-digit"})},1000);
</script>
</body>
</html>
