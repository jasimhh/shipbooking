<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Q · Night Sea</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root{--sea:#061423;--sea-2:#0A1E33;--land:#13283D;--land-line:#1E3A55;--glass:rgba(10,24,40,.72);--line:rgba(140,190,230,.18);--text:#E4EEF7;--dim:#8DA6BD;--route:#5BC0FF;--ok:#48E5A2;--warn:#FFC24B;--bad:#FF6B6B}
  *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--sea);color:var(--text);font:400 14px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
  :focus-visible{outline:2px solid var(--route);outline-offset:2px}
  .stage{position:relative;min-height:100vh}
  .map{position:absolute;inset:0}.map svg{width:100%;height:100%;display:block}
  .glass{background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .topbar{position:absolute;top:14px;left:14px;right:14px;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 14px;flex-wrap:wrap;z-index:2}
  .brand{font-weight:700}.brand span{color:var(--route)}
  .topbar nav{display:flex;gap:2px;flex-wrap:wrap}.topbar nav a{color:var(--dim);text-decoration:none;font-weight:500;padding:6px 10px;border-radius:9px}.topbar nav a:hover{color:var(--text)}.topbar nav a[aria-current]{background:rgba(91,192,255,.15);color:var(--route)}
  .sp{flex:1}
  .routes{display:flex;gap:4px;background:rgba(255,255,255,.06);border-radius:10px;padding:3px}
  .routes button{font:600 13px Inter;background:none;border:0;color:var(--dim);padding:6px 10px;border-radius:8px;cursor:pointer}.routes button[aria-pressed=true]{background:var(--route);color:#04121F}
  .btn{font:600 13px Inter;border:0;background:var(--route);color:#04121F;padding:8px 12px;border-radius:9px;cursor:pointer}.btn.sec{background:rgba(255,255,255,.08);color:var(--text)}
  .left{position:absolute;top:84px;left:14px;width:min(320px,calc(100% - 28px));padding:14px;z-index:2}
  .left h2,.right h2{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
  .sail{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:12px;cursor:pointer;border:1px solid transparent;width:100%;background:none;color:inherit;font:inherit;text-align:left}
  .sail:hover{background:rgba(255,255,255,.04)}.sail[aria-pressed=true]{border-color:var(--route);background:rgba(91,192,255,.08)}
  .sail .t{font:600 18px "JetBrains Mono"}.sail small{display:block;color:var(--dim)}
  .prog{grid-column:1/-1;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}.prog i{display:block;height:100%;background:var(--route)}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}.ok{background:rgba(72,229,162,.15);color:var(--ok)}.warn{background:rgba(255,194,75,.15);color:var(--warn)}.bad{background:rgba(255,107,107,.15);color:var(--bad)}.sea{background:rgba(91,192,255,.15);color:var(--route)}
  .right{position:absolute;top:84px;right:14px;width:min(340px,calc(100% - 28px));padding:14px;z-index:2;max-height:calc(100vh - 200px);overflow:auto}
  .pax{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer;width:100%;border:0;background:none;color:inherit;font:inherit;text-align:left}
  .pax:hover{background:rgba(255,255,255,.04)}.pax[aria-pressed=true]{background:rgba(91,192,255,.1)}
  .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#04121F;flex:none}
  .pax .n{flex:1}.pax small{display:block;color:var(--dim);font:500 11px "JetBrains Mono"}
  .det{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.det h3{margin:0;font-size:18px}.det dl{display:grid;grid-template-columns:80px 1fr;gap:6px 10px;margin:10px 0}.det dt{color:var(--dim)}.det dd{margin:0}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .bottom{position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:10px;flex-wrap:wrap;z-index:2}
  .fcard{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;padding:10px 12px}
  .fcard i{width:10px;height:10px;border-radius:50%;flex:none}.fcard small{display:block;color:var(--dim)}.fcard .tag{margin-left:auto}
  .note{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--warn);z-index:2;white-space:nowrap}
  .port{font:600 12px Inter;fill:var(--text)}.place{font:500 11px Inter;fill:#4F6E8C;letter-spacing:.14em;text-transform:uppercase}
  .glow{filter:drop-shadow(0 0 6px rgba(91,192,255,.9))}
  @media(max-width:900px){.stage{min-height:auto;display:flex;flex-direction:column;gap:12px;padding:12px}.map{position:relative;height:340px;border-radius:16px;overflow:hidden;order:2}.topbar,.left,.right,.bottom,.note{position:relative;inset:auto;width:auto;transform:none;max-height:none}.topbar{order:1}.left{order:3}.right{order:4}.bottom{order:5}.note{order:6;white-space:normal}}
  .drawer{position:fixed;inset:0 0 0 auto;width:min(420px,100%);padding:20px;transform:translateX(100%);transition:transform .2s;z-index:5;overflow:auto;border-radius:0}
  .drawer.open{transform:none}
  label{display:block;font-weight:500;color:var(--dim);margin:14px 0 6px}
  .drawer input,.drawer select,.drawer textarea{width:100%;font:inherit;color:var(--text);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color-scheme:dark}
  .drawer input:focus,.drawer select:focus,.drawer textarea:focus{outline:none;border-color:var(--route)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="map" id="map" aria-label="Live map"></div>
  <div class="topbar glass">
    <span class="brand">Ship<span>·</span>Booking</span>
    <nav aria-label="Admin"><a href="#" aria-current="page">Live</a><a href="#">Sailings</a><a href="#">Ferries</a><a href="#">Bookings</a><a href="#">Passengers</a><a href="#">Refunds</a></nav>
    <span class="sp"></span>
    <div class="routes" role="group" aria-label="Route"><button data-route="mum" aria-pressed="false">Mumbai ⇄ Mandwa</button><button data-route="and" aria-pressed="true">Andamans</button></div>
    <button class="btn" id="add">+ Ferry</button>
  </div>
  <aside class="left glass" aria-label="Sailings"><h2>Sailings now</h2><div id="sails"></div></aside>
  <aside class="right glass" aria-label="Passengers"><h2 id="paxTitle">Passengers</h2><div id="paxList"></div><div class="det" id="detail" aria-live="polite"></div></aside>
  <p class="note">Example data · ferry positions estimated from timetable</p>
  <div class="bottom">
    <div class="fcard glass"><i style="background:var(--ok)"></i><div><b>MV Demo Star</b><small>180 · Demo Ferries</small></div><span class="tag ok">Boarding</span></div>
    <div class="fcard glass"><i style="background:var(--route)"></i><div><b>MV Demo Wave</b><small>24 seats · Demo Ferries</small></div><span class="tag sea">At sea</span></div>
    <div class="fcard glass"><i style="background:var(--warn)"></i><div><b>MV Example Breeze</b><small>320 · Example Lines</small></div><span class="tag warn">Repairs</span></div>
  </div>
</div>
<form class="drawer glass" id="drawer" aria-label="Add a ferry" onsubmit="return false">
  <h2 style="margin:0;font-size:18px">Add a ferry</h2>
  <label for="f1">Ferry name</label><input id="f1" placeholder="MV …">
  <div class="row2"><div><label for="f2">Operator</label><select id="f2"><option>Demo Ferries</option><option>Example Lines</option></select></div><div><label for="f3">IMO number</label><input id="f3" placeholder="Optional"></div></div>
  <div class="row2"><div><label for="f4">Seating</label><select id="f4"><option>By capacity</option><option>Numbered seats</option></select></div><div><label for="f5">Home route</label><select id="f5"><option>Mumbai ⇄ Mandwa</option><option>Andamans</option></select></div></div>
  <label for="f6">Classes and capacity</label><textarea id="f6" rows="3">Deck · 120
Seater · 60</textarea>
  <div class="acts" style="margin-top:16px"><button class="btn">Add ferry</button><button class="btn sec" type="button" id="close">Cancel</button></div>
</form>
<script>
const MAPS={
  mum:`<svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice"><rect width="1000" height="600" fill="#061423"/><g fill="none" stroke="#0E2740">${[...Array(9)].map((_,k)=>`<path d="M-50 ${80+k*60} Q250 ${50+k*60} 500 ${90+k*60} T1050 ${70+k*60}"/>`).join("")}</g>
    <path d="M150 0 L330 0 L350 120 L330 240 L300 330 L270 410 L240 460 L215 470 L200 420 L180 330 L160 200Z" fill="#13283D" stroke="#1E3A55"/>
    <path d="M620 0 L1000 0 L1000 600 L760 600 L720 540 L700 460 L670 410 L650 340 L670 260 L640 180 L620 100Z" fill="#13283D" stroke="#1E3A55"/>
    <text class="place" x="190" y="80">Mumbai</text><text class="place" x="800" y="120">Raigad</text>
    <path id="rt" d="M262 370 C380 380 520 440 678 440" fill="none" stroke="#5BC0FF" stroke-width="2" stroke-dasharray="7 6" opacity=".8"/>
    <circle cx="262" cy="370" r="7" fill="#061423" stroke="#E4EEF7" stroke-width="2"/><text class="port" x="130" y="366">Ferry Wharf</text>
    <circle cx="678" cy="440" r="7" fill="#061423" stroke="#E4EEF7" stroke-width="2"/><text class="port" x="692" y="444">Mandwa Jetty</text>
    <g class="glow"><circle r="9" fill="#5BC0FF"><animateMotion dur="20s" repeatCount="indefinite"><mpath href="#rt"/></animateMotion></circle></g>
  </svg>`,
  and:`<svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice"><rect width="1000" height="600" fill="#061423"/><g fill="none" stroke="#0E2740">${[...Array(9)].map((_,k)=>`<path d="M-50 ${80+k*60} Q250 ${50+k*60} 500 ${90+k*60} T1050 ${70+k*60}"/>`).join("")}</g>
    <path d="M140 140 L260 110 L320 170 L340 280 L300 390 L250 500 L180 540 L130 450 L110 320Z" fill="#13283D" stroke="#1E3A55"/>
    <path d="M640 80 L740 60 L800 120 L790 210 L720 260 L650 210 L620 140Z" fill="#13283D" stroke="#1E3A55"/>
    <path d="M590 330 L650 320 L670 360 L630 390 L585 375Z" fill="#13283D" stroke="#1E3A55"/>
    <text class="place" x="150" y="230">South Andaman</text><text class="place" x="650" y="45">Swaraj Dweep</text><text class="place" x="560" y="420">Shaheed Dweep</text>
    <path id="rt" d="M320 350 C450 330 580 230 650 175" fill="none" stroke="#5BC0FF" stroke-width="2" stroke-dasharray="7 6" opacity=".8"/>
    <circle cx="320" cy="350" r="7" fill="#061423" stroke="#E4EEF7" stroke-width="2"/><text class="port" x="336" y="380">Phoenix Bay Jetty</text>
    <circle cx="650" cy="175" r="7" fill="#061423" stroke="#E4EEF7" stroke-width="2"/><text class="port" x="666" y="180">Havelock Jetty</text>
    <g style="filter:drop-shadow(0 0 6px rgba(72,229,162,.9))"><circle cx="320" cy="350" r="9" fill="#48E5A2"/></g>
  </svg>`};
const SAILS={mum:[["07:00","Mumbai → Mandwa","MV Demo Wave · 21/24","warn","+20 min",0],["05:45","Mandwa → Mumbai","MV Demo Wave · 24/24","sea","At sea",64]],and:[["06:30","Phoenix Bay → Havelock","MV Demo Star · 2/180","ok","Boarding",4],["09:30","Havelock → Phoenix Bay","MV Demo Star · 41/180","ok","On time",0]]};
const PAX={mum:[["Rohan Das","RD","#FF6B6B","SBP3XH8K2N","27 · Male","rohan@example.com","+91 98222 22222","Deck","Unpaid · hold 21:40"]],and:[["Asha Rao","AR","#5BC0FF","SBKH46K99Z","34 · Female","asha@example.com","+91 98000 00000","Deck","Valid · ₹975 paid"],["Kiran Rao","KR","#5BC0FF","SBKH46K99Z","8 · Male","asha@example.com","+91 98000 00000","Deck","Valid · ₹975 paid"],["Meera Iyer","MI","#48E5A2","SB7QW2MZ4D","61 · Female","meera@example.com","+91 98111 11111","Cabin seat 07","Boarded 06:12"]]};
let route="and";
function detail(p){document.getElementById("detail").innerHTML=`<h3>${p[0]}</h3><div style="color:var(--dim)">${p[4]}</div><dl><dt>Booking</dt><dd style="font-family:JetBrains Mono">${p[3]}</dd><dt>Email</dt><dd>${p[5]}</dd><dt>Mobile</dt><dd>${p[6]}</dd><dt>Class</dt><dd>${p[7]}</dd><dt>Ticket</dt><dd>${p[8]}</dd></dl><div class="acts"><button class="btn">Open booking</button><button class="btn sec">Reissue</button></div>`}
function render(){
  document.getElementById("map").innerHTML=MAPS[route];
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)document.querySelectorAll("animateMotion").forEach(a=>a.remove());
  document.getElementById("sails").innerHTML=SAILS[route].map((s,i)=>`<button class="sail" aria-pressed="${i===0}"><span class="t">${s[0]}</span><span><b>${s[1]}</b><small>${s[2]}</small></span><span class="tag ${s[3]}">${s[4]}</span><span class="prog"><i style="width:${s[5]}%"></i></span></button>`).join("");
  document.querySelectorAll(".sail").forEach(b=>b.onclick=()=>document.querySelectorAll(".sail").forEach(x=>x.setAttribute("aria-pressed",x===b)));
  document.getElementById("paxTitle").textContent=`Passengers · ${SAILS[route][0][0]} sailing`;
  const list=PAX[route];document.getElementById("paxList").innerHTML=list.map((p,i)=>`<button class="pax" data-i="${i}" aria-pressed="${i===0}"><span class="av" style="background:${p[2]}">${p[1]}</span><span class="n">${p[0]}<small>${p[3]}</small></span></button>`).join("");
  document.querySelectorAll(".pax").forEach(b=>b.onclick=()=>{detail(list[b.dataset.i]);document.querySelectorAll(".pax").forEach(x=>x.setAttribute("aria-pressed",x===b))});detail(list[0]);
  document.querySelectorAll("[data-route]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.route===route));
}
document.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>{route=b.dataset.route;render()});render();
const dr=document.getElementById("drawer");document.getElementById("add").onclick=()=>{dr.classList.add("open");dr.querySelector("input").focus()};document.getElementById("close").onclick=()=>dr.classList.remove("open");
</script>
</body>
</html>
