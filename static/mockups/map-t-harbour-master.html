<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map T · Harbour Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root{--sand:#F6EFE4;--card:#FFFCF7;--ink:#1F2A30;--dim:#66737B;--line:#E9DFCF;--sea:#CFE6EA;--sea-2:#B9D9DF;--land:#F1E7D6;--land-line:#DCCDB4;--teal:#0F6E73;--coral:#E8664A;--green:#2E8B57;--amber:#B86E00}
  *{box-sizing:border-box}body{margin:0;background:var(--sand);color:var(--ink);font:400 15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
  :focus-visible{outline:3px solid var(--coral);outline-offset:2px}
  .shell{display:grid;grid-template-columns:1fr;min-height:100vh}@media(min-width:1000px){.shell{grid-template-columns:1fr 420px}}
  .mapwrap{position:relative;min-height:56vh}
  .mapwrap svg{position:absolute;inset:0;width:100%;height:100%}
  .float{position:absolute;left:14px;right:14px;top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pill{background:var(--card);border-radius:999px;padding:8px 14px;box-shadow:0 6px 20px rgba(31,42,48,.12);font-weight:700;display:flex;align-items:center;gap:8px}
  .pill i{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(46,139,87,.2)}
  .routes{display:flex;gap:4px;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 6px 20px rgba(31,42,48,.12)}
  .routes button{font:700 13px "Plus Jakarta Sans";border:0;background:none;padding:6px 12px;border-radius:999px;color:var(--dim);cursor:pointer}.routes button[aria-pressed=true]{background:var(--teal);color:#fff}
  .sp{flex:1}.fab{font:700 14px "Plus Jakarta Sans";border:0;background:var(--coral);color:#fff;padding:10px 16px;border-radius:999px;box-shadow:0 8px 20px rgba(232,102,74,.35);cursor:pointer}
  .ferrycard{position:absolute;left:14px;bottom:14px;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:0 10px 30px rgba(31,42,48,.15);display:flex;gap:12px;align-items:center;max-width:calc(100% - 28px)}
  .ferrycard .ic{width:44px;height:44px;border-radius:14px;background:#DDEFF0;display:grid;place-items:center;color:var(--teal);font-weight:800}
  .ferrycard small{display:block;color:var(--dim)}
  .eta{margin-left:6px;text-align:right}.eta b{display:block;font-size:20px;font-weight:800;color:var(--teal)}
  .port{font:700 13px "Plus Jakarta Sans";fill:var(--ink)}.place{font:600 11px "Plus Jakarta Sans";fill:#A99878;letter-spacing:.12em;text-transform:uppercase}
  .sheet{background:var(--card);border-radius:24px 24px 0 0;margin-top:-24px;position:relative;box-shadow:0 -10px 30px rgba(31,42,48,.08);padding:10px 16px 30px}
  @media(min-width:1000px){.sheet{margin-top:0;border-radius:0;border-left:1px solid var(--line);box-shadow:none;max-height:100vh;overflow:auto}}
  .handle{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}@media(min-width:1000px){.handle{display:none}}
  .brand{font-weight:800;font-size:18px;display:flex;justify-content:space-between;align-items:center}.brand small{font-weight:500;font-size:13px;color:var(--dim)}
  .note{font-size:12px;font-weight:700;color:var(--amber);margin:4px 0 10px}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sand);border-radius:14px;padding:4px;margin-bottom:14px}
  .tabs button{font:700 14px "Plus Jakarta Sans";border:0;background:none;padding:8px;border-radius:10px;color:var(--dim);cursor:pointer}.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(31,42,48,.1)}
  .list{display:grid;gap:8px}
  .item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--sand);border:2px solid transparent;cursor:pointer;width:100%;font:inherit;color:inherit;text-align:left}
  .item[aria-pressed=true]{border-color:var(--teal);background:#EAF4F3}
  .av{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
  .item .t{flex:1;min-width:0}.item small{display:block;color:var(--dim)}
  .tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}.ok{background:#DDF1E5;color:var(--green)}.warn{background:#FBEBD2;color:var(--amber)}.bad{background:#FCE3DD;color:#C24A30}.sea{background:#DDEFF0;color:var(--teal)}
  .time{font-weight:800;font-size:18px;width:54px}
  .det{margin-top:16px;padding:16px;border-radius:18px;background:var(--sand)}
  .det h3{margin:0;font-size:22px;font-weight:800}.det .sub{color:var(--dim)}
  .det dl{display:grid;grid-template-columns:90px 1fr;gap:8px 12px;margin:12px 0}.det dt{color:var(--dim)}.det dd{margin:0;font-weight:600}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .btn{font:700 14px "Plus Jakarta Sans";border:0;background:var(--teal);color:#fff;padding:10px 14px;border-radius:12px;cursor:pointer}.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .modal-wrap{position:fixed;inset:0;background:rgba(31,42,48,.35);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}.modal-wrap.open{opacity:1;pointer-events:auto}
  .modal{width:min(520px,100%);background:var(--card);border-radius:24px 24px 0 0;padding:16px 18px 24px;max-height:92vh;overflow:auto}
  label{display:block;font-weight:600;margin:12px 0 6px}
  .modal input,.modal select,.modal textarea{width:100%;font:inherit;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px}.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--teal)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(prefers-reduced-motion:reduce){.modal-wrap{transition:none}}
</style>
</head>
<body>
<div class="shell">
  <section class="mapwrap" aria-label="Live map">
    <div id="map"></div>
    <div class="float">
      <span class="pill"><i aria-hidden="true"></i>Live · 21:42</span>
      <div class="routes" role="group" aria-label="Route"><button data-route="mum" aria-pressed="false">Mumbai</button><button data-route="and" aria-pressed="true">Andamans</button></div>
      <span class="sp"></span><button class="fab" id="add">+ Ferry</button>
    </div>
    <div class="ferrycard" id="fc"></div>
  </section>
  <section class="sheet" aria-label="Details">
    <div class="handle" aria-hidden="true"></div>
    <div class="brand">Ship Booking<small>Harbour master</small></div>
    <p class="note">Example data · positions estimated from timetable</p>
    <div class="tabs" role="tablist"><button role="tab" data-tab="sail" aria-selected="false">Sailings</button><button role="tab" data-tab="pax" aria-selected="true">Passengers</button><button role="tab" data-tab="fleet" aria-selected="false">Ferries</button></div>
    <div class="list" id="list"></div>
    <div class="det" id="detail" aria-live="polite"></div>
  </section>
</div>
<div class="modal-wrap" id="drawer"><form class="modal" aria-label="Add a ferry" onsubmit="return false">
  <div class="handle" style="display:block"></div><h2 style="margin:0">Add a ferry</h2>
  <label for="f1">Ferry name</label><input id="f1" placeholder="MV …">
  <div class="row2"><div><label for="f2">Operator</label><select id="f2"><option>Demo Ferries</option><option>Example Lines</option></select></div><div><label for="f3">IMO number</label><input id="f3"></div></div>
  <div class="row2"><div><label for="f4">Seating</label><select id="f4"><option>By capacity</option><option>Numbered seats</option></select></div><div><label for="f5">Home route</label><select id="f5"><option>Mumbai</option><option>Andamans</option></select></div></div>
  <label for="f6">Classes and capacity</label><textarea id="f6" rows="3">Deck · 120
Seater · 60</textarea>
  <div class="acts" style="margin-top:16px"><button class="btn">Add ferry</button><button class="btn sec" type="button" id="close">Cancel</button></div>
</form></div>
<script>
const D={
 mum:{land:`<path d="M150 0 L330 0 L350 120 L330 240 L300 330 L270 410 L240 460 L215 470 L200 420 L180 330 L160 200Z"/><path d="M620 0 L1000 0 L1000 600 L760 600 L720 540 L700 460 L670 410 L650 340 L670 260 L640 180 L620 100Z"/>`,places:`<text class="place" x="190" y="110">Mumbai</text><text class="place" x="800" y="150">Raigad</text>`,path:"M262 370 C380 380 520 440 678 440",ports:[[262,370,"Ferry Wharf",-110,-6],[678,440,"Mandwa Jetty",14,5]],moving:true,
  fc:["DW","MV Demo Wave","At sea · 24/24","06:45","arrives"],
  sail:[["05:45","Mandwa → Mumbai","MV Demo Wave · 24/24","sea","At sea"],["07:00","Mumbai → Mandwa","MV Demo Wave · 21/24","warn","+20 min"]],
  pax:[["Meera Iyer","MI","#2E8B57","SB7QW2MZ4D","61 · Female","meera@example.com","+91 98111 11111","Cabin seat 07","sea","Boarded"],["Rohan Das","RD","#E8664A","SBP3XH8K2N","27 · Male","rohan@example.com","+91 98222 22222","Deck","bad","Unpaid"]]},
 and:{land:`<path d="M140 140 L260 110 L320 170 L340 280 L300 390 L250 500 L180 540 L130 450 L110 320Z"/><path d="M640 80 L740 60 L800 120 L790 210 L720 260 L650 210 L620 140Z"/><path d="M590 330 L650 320 L670 360 L630 390 L585 375Z"/>`,places:`<text class="place" x="150" y="250">South Andaman</text><text class="place" x="650" y="45">Swaraj Dweep</text>`,path:"M320 350 C450 330 580 230 650 175",ports:[[320,350,"Phoenix Bay Jetty",16,32],[650,175,"Havelock Jetty",16,6]],moving:false,
  fc:["DS","MV Demo Star","Boarding · Gate 2 · 2/180","06:30","departs"],
  sail:[["06:30","Phoenix Bay → Havelock","MV Demo Star · 2/180","ok","Boarding"],["09:30","Havelock → Phoenix Bay","MV Demo Star · 41/180","ok","On time"]],
  pax:[["Asha Rao","AR","#0F6E73","SBKH46K99Z","34 · Female","asha@example.com","+91 98000 00000","Deck","ok","Valid"],["Kiran Rao","KR","#0F6E73","SBKH46K99Z","8 · Male","asha@example.com","+91 98000 00000","Deck","ok","Valid"]]}};
const FLEET=[["DS","MV Demo Star","Demo Ferries · 180","ok","In service"],["DW","MV Demo Wave","Demo Ferries · 24 seats","ok","In service"],["EB","MV Example Breeze","Example Lines · 320","warn","Repairs"]];
let route="and",tab="pax";
function map(d){document.getElementById("map").innerHTML=`<svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice"><rect width="1000" height="600" fill="#CFE6EA"/><g fill="none" stroke="#B9D9DF">${[...Array(9)].map((_,k)=>`<path d="M-50 ${60+k*60} Q250 ${30+k*60} 500 ${70+k*60} T1050 ${50+k*60}"/>`).join("")}</g><g fill="#F1E7D6" stroke="#DCCDB4" stroke-width="2">${d.land}</g>${d.places}<path id="rt" d="${d.path}" fill="none" stroke="#0F6E73" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 12"/>${d.ports.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="#fff" stroke="#1F2A30" stroke-width="3"/><text class="port" x="${p[0]+p[3]}" y="${p[1]+p[4]}">${p[2]}</text>`).join("")}${d.moving?`<g><circle r="16" fill="#fff" stroke="#E8664A" stroke-width="4"><animateMotion dur="20s" repeatCount="indefinite"><mpath href="#rt"/></animateMotion></circle><circle r="6" fill="#E8664A"><animateMotion dur="20s" repeatCount="indefinite"><mpath href="#rt"/></animateMotion></circle></g>`:`<circle cx="${d.ports[0][0]}" cy="${d.ports[0][1]}" r="16" fill="#fff" stroke="#2E8B57" stroke-width="4"/><circle cx="${d.ports[0][0]}" cy="${d.ports[0][1]}" r="6" fill="#2E8B57"/>`}</svg>`;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)document.querySelectorAll("animateMotion").forEach(a=>a.remove());
  const f=d.fc;document.getElementById("fc").innerHTML=`<span class="ic">${f[0]}</span><span><b>${f[1]}</b><small>${f[2]}</small></span><span class="eta"><small>${f[4]}</small><b>${f[3]}</b></span>`}
function det(p){document.getElementById("detail").innerHTML=p?`<h3>${p[0]}</h3><div class="sub">${p[4]}</div><dl><dt>Booking</dt><dd>${p[3]}</dd><dt>Email</dt><dd>${p[5]}</dd><dt>Mobile</dt><dd>${p[6]}</dd><dt>Class</dt><dd>${p[7]}</dd><dt>Ticket</dt><dd>${p[9]}</dd></dl><div class="acts"><button class="btn">Open booking</button><button class="btn sec">Call</button><button class="btn sec">Reissue</button></div>`:""}
function list(){const d=D[route],el=document.getElementById("list");let html="";
  if(tab==="pax")html=d.pax.map((p,i)=>`<button class="item" data-i="${i}" aria-pressed="${i===0}"><span class="av" style="background:${p[2]}">${p[1]}</span><span class="t"><b>${p[0]}</b><small>${p[3]} · ${p[4]}</small></span><span class="tag ${p[8]}">${p[9]}</span></button>`).join("");
  if(tab==="sail")html=d.sail.map((s,i)=>`<button class="item" aria-pressed="${i===0}"><span class="time">${s[0]}</span><span class="t"><b>${s[1]}</b><small>${s[2]}</small></span><span class="tag ${s[3]}">${s[4]}</span></button>`).join("");
  if(tab==="fleet")html=FLEET.map((f,i)=>`<button class="item" aria-pressed="false"><span class="av" style="background:#0F6E73">${f[0]}</span><span class="t"><b>${f[1]}</b><small>${f[2]}</small></span><span class="tag ${f[3]}">${f[4]}</span></button>`).join("");
  el.innerHTML=html;el.querySelectorAll(".item").forEach(b=>b.onclick=()=>{el.querySelectorAll(".item").forEach(x=>x.setAttribute("aria-pressed",x===b));if(tab==="pax")det(d.pax[b.dataset.i])});
  det(tab==="pax"?d.pax[0]:null);document.getElementById("detail").style.display=tab==="pax"?"":"none"}
function render(){map(D[route]);list();document.querySelectorAll("[data-route]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.route===route));document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab))}
document.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>{route=b.dataset.route;render()});document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
const dr=document.getElementById("drawer");const close=()=>dr.classList.remove("open");document.getElementById("add").onclick=()=>{dr.classList.add("open");dr.querySelector("input").focus()};document.getElementById("close").onclick=close;dr.onclick=e=>{if(e.target===dr)close()};
</script>
</body>
</html>
