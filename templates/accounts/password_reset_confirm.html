{% extends "accounts/form_page.html" %}
{% block form %}
  {% if validlink %}
    {{ block.super }}
  {% else %}
    <div class="alert alert-error" role="alert"><svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
      <p>This reset link has expired or was already used.</p></div>
    <div class="pass-actions"><span></span><a class="btn btn-board" href="{% url 'accounts:password_reset' %}">Request a new link <span aria-hidden="true">→</span></a></div>
  {% endif %}
{% endblock %}
